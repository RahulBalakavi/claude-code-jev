[project]
name = "jev-auto-mode"
version = "0.1.0"
description = "A Jev-backed permission classifier and benchmark for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jev Auto Mode contributors" }]
keywords = ["claude-code", "jev", "agents", "guardrails", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
jev-auto-mode = "jev_auto_mode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
    "ruff>=0.13.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_auto_mode"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
